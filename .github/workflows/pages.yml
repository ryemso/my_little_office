name: Publish office
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: office-pages
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/build_office_component.py --check
      - run: python scripts/build_release_manifest.py --check
      - run: node --check site/app.js
      - run: node --check site/runtime.js
      - run: node scripts/check_office_component.cjs
      - run: python3 -m unittest discover -s scripts/tests -v
      - name: Install pinned Codex for protocol handshake (no inference)
        run: npm install --prefix "$RUNNER_TEMP/office-protocol" @openai/codex@0.163.0
      - name: Validate real Codex schema and initialization
        run: python -m office.protocol_probe --codex "$RUNNER_TEMP/office-protocol/node_modules/.bin/codex"
      - run: python -m playwright install --with-deps chromium
      - run: python -m scripts.test_browser_adapter
      - run: python -m scripts.test_web_office
      - run: python3 scripts/check_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
